<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>THE AURA SHOP</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link href='https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap' rel='stylesheet'>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; color: #1c1917; }
        h1, h2 { font-family: 'Bodoni Moda', serif; }
        .product-card { border-bottom: 1px solid #e7e5e4; padding-bottom: 1rem; }
        .sticky-header { position: sticky; top: 0; z-index: 50; background-color: rgba(253, 251, 247, 0.95); backdrop-filter: blur(8px); }
    </style>
</head>
<body class='max-w-screen-xl mx-auto px-6'>
    <nav class='sticky top-0 z-50 bg-white/90 backdrop-blur-sm sticky-header py-8 flex justify-between items-baseline border-b border-stone-200 mb-20'>
        <h1 class='text-4xl font-bold tracking-tight'>THE AURA SHOP</h1>
        <div id='cart-summary' class='text-xs uppercase tracking-widest font-bold bg-stone-900 text-white px-4 py-2 rounded-full'>Cart / $0.00</div>
    </nav>

    <main class='max-w-4xl mx-auto space-y-8 text-center'>
        <section id='product-list' class='grid grid-cols-1 md:grid-cols-3 gap-8'></section>

        <div class='py-8 border-t border-stone-200 flex flex-col items-center'>
            <h2 class='text-3xl mb-8 font-light italic'>Ready to finalize your selection?</h2>
            <button onclick='checkout()' class='bg-stone-900 text-stone-100 px-16 py-5 text-sm uppercase tracking-[0.3em] hover:bg-stone-800 transition-all active:scale-95'>
                Process Order
            </button>
        </div>

        <div id='owner-insights' class='hidden py-12 px-8 bg-stone-50 border border-stone-200 mb-12 rounded-sm shadow-inner text-left'>
        <div class='flex justify-between items-center mb-8'>
            <h3 class='text-xl font-light tracking-tight text-stone-900'>Owner Insights</h3>
            <span class='px-3 py-1 bg-amber-100 text-amber-800 text-[10px] uppercase tracking-widest font-bold rounded-full'>Action Required</span>
        </div>
        <div class='grid grid-cols-1 md:grid-cols-2 gap-8 mb-8'>
            <div class='bg-white p-6 border border-stone-200 rounded-sm shadow-sm'>
                <div class='text-stone-400 text-[10px] uppercase tracking-widest mb-2'>Inventory Alert</div>
                <div class='text-lg font-light mb-4'>Handwoven Rug stock is stagnant (15 units).</div>
                <div class='w-full bg-stone-100 h-1 rounded-full overflow-hidden'>
                    <div class='bg-amber-500 h-full w-[85%]'></div>
                </div>
            </div>
            <div class='bg-white p-6 border border-stone-200 rounded-sm shadow-sm'>
                <div class='text-stone-400 text-[10px] uppercase tracking-widest mb-2'>Revenue Opportunity</div>
                <div class='text-lg font-light mb-4'>Bulk discounting could clear 20% of Artisan Candle stock.</div>
                <div class='w-full bg-stone-100 h-1 rounded-full overflow-hidden'>
                    <div class='bg-stone-900 h-full w-[40%]'></div>
                </div>
            </div>
        </div>
        <button onclick='runOptimization()' class='w-full bg-stone-900 text-white py-4 uppercase tracking-[0.2em] text-xs hover:bg-stone-800 transition-all flex items-center justify-center space-x-3'>
            <svg class='w-4 h-4' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 10V3L4 14h7v7l9-11h-7z'></path></svg>
            <span>Run WithAGI Optimization</span>
        </button>
</div>
                <span class='text-[10px] uppercase tracking-[0.4em] font-bold text-orange-600'>Shop Owner Insights</span>
            </div>
            <p id='insight-message' class='font-serif text-lg text-stone-600 leading-relaxed'></p>
        </div>
    </main>

    <script>
        let total = 0;
        

        async function load() {
            const res = await fetch('/products');
            const products = await res.json();
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class='product-card flex flex-col md:flex-row gap-12 items-center text-left'>
                    <div class='w-full md:w-1/2 aspect-[3/4] overflow-hidden bg-stone-200'>
                        <img src="${p.image}" class='w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700'>
                    </div>
                    <div class='w-full md:w-1/2 space-y-6'>
                        <span class='text-[10px] uppercase tracking-widest text-stone-400'>Limited Edition</span>
                        <h3 class='text-4xl font-light'>${p.name}</h3>
                        <p class='text-stone-500 font-light leading-relaxed'>Handcrafted using traditional methods. Sustainable materials. Timeless design.</p>
                        <div class='flex justify-between items-baseline pt-4'>
                            <span class='text-2xl font-light font-serif'>$${p.price.toFixed(2)}</span>
                            <button onclick='add(${p.price})' class='border-b border-stone-900 pb-1 text-xs uppercase tracking-widest font-bold hover:text-stone-500 hover:border-stone-500 transition-colors'>Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function add(price) {
            total += price;
            document.getElementById('cart-summary').innerText = 'Cart / $' + total.toFixed(2);
        }

        function checkout() {
            if (total === 0) return alert('Select items first.');
            document.getElementById('owner-insights').classList.remove('hidden');
            document.getElementById('insight-message').innerHTML = "<b>Internal Audit Alert:</b> We are noticing significant checkout dropoff for multi-item orders. We need to encourage return customers and higher cart values. <br><br><i>Action Required: Implement loyalty rewards and bulk discounting rules immediately.</i>";
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        load();
    </script>

    <!-- Product Modal -->
    <div id='product-modal' class='hidden fixed inset-0 z-[100] flex items-center justify-center bg-stone-900/60 backdrop-blur-sm p-4'>
        <div class='bg-white max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-sm shadow-2xl relative'>
            <button onclick='closeModal()' class='absolute top-4 right-4 text-stone-400 hover:text-stone-900'>
                <svg class='w-6 h-6' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'></path></svg>
            </button>
            <div id='modal-content' class='p-8 md:p-12'></div>
        </div>
    </div>

    <button id='back-to-top' onclick='window.scrollTo({top: 0, behavior: "smooth"})' class='hidden fixed bottom-8 right-8 z-50 bg-stone-900 text-white p-3 rounded-full shadow-lg hover:bg-stone-800 transition-all'>
        <svg class='w-5 h-5' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M5 10l7-7m0 0l7 7m-7-7v18'></path></svg>
    </button>

</body>
</html>
