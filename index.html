<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>The Aura Shop | Artisan Collective</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link href='https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap' rel='stylesheet'>
    <style>
        body { font-family: "Inter", sans-serif; background-color: #fdfbf7; }
        h1, h2, h3 { font-family: "Playfair Display", serif; }
    </style>
</head>
<body class='text-stone-800 border-t-8 border-stone-900'>
    <nav class='max-w-6xl mx-auto px-6 py-12 flex justify-between items-center'>
        <h1 class='text-4xl font-bold tracking-tight'>THE AURA SHOP</h1>
        <div id='cart-summary' class='font-semibold text-sm uppercase tracking-widest'>
            Cart: $0.00
        </div>
    </nav>

    <main class='max-w-6xl mx-auto px-6 pb-24'>
        <section class='grid grid-cols-1 md:grid-cols-2 gap-16' id='product-list'>
            <!-- Products injected here -->
        </section>

        <div class='mt-12 flex justify-end'>
            <button onclick='checkout()' class='bg-stone-900 text-white px-12 py-4 uppercase tracking-widest text-sm font-bold hover:bg-stone-700 transition-colors'>
                Place Order
            </button>
        </div>

        <section id='agi-outcome' class='mt-16 p-8 border-2 border-dashed border-stone-200 rounded-xl hidden'>
            <div class='flex items-center gap-3 mb-4'>
                <div class='w-3 h-3 bg-blue-500 rounded-full animate-pulse'></div>
                <span class='text-xs font-bold uppercase tracking-widest text-blue-600'>WithAGI Logic Trail</span>
            </div>
            <div id='outcome-message' class='text-stone-600 text-sm italic'></div>
        </section>
    </main>

    <script>
        let cartTotal = 0;
        const images = {
            1: "https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=800&q=80",
            2: "https://images.unsplash.com/photo-1576444399535-64a02967fe8b?auto=format&fit=crop&w=800&q=80"
        };

        async function loadProducts() {
            const res = await fetch('/products');
            const products = await res.json();
            const container = document.getElementById('product-list');
            container.innerHTML = products.map(p => `
                <div class='group relative'>
                    <div class='aspect-[4/5] bg-stone-200 mb-6 overflow-hidden'>
                        <img src="${images[p.id]}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <div class='flex justify-between items-end'>
                        <div>
                            <h3 class='text-2xl mb-1'>${p.name}</h3>
                            <p class='text-xs uppercase tracking-widest text-stone-400'>Stock: ${p.inventory} available</p>
                        </div>
                        <button onclick='addToCart(${p.price})' class='text-sm border-b-2 border-stone-900 pb-1 font-bold'>
                            Add • $${p.price.toFixed(2)}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(price) {
            cartTotal += price;
            document.getElementById('cart-summary').innerText = `Cart: $${cartTotal.toFixed(2)}`;
        }

        function checkout() {
            if (cartTotal === 0) { alert('Your cart is empty'); return; }
            alert('Demo Mode: Submitting order total of $' + cartTotal.toFixed(2) + ' to WithAGI-managed backend...');
            if (cartTotal > 200) {
                document.getElementById('agi-outcome').classList.remove('hidden');
                document.getElementById('outcome-message').innerText = "Checking for discounts... In a static app, the price stays $ " + cartTotal.toFixed(2) + ". WithAGI will refactor this logic to automate rewards.";
            }
        }

        loadProducts();
    </script>
</body>
</html>
