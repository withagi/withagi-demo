<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>The Aura Shop | Artisan Collective</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link href='https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap' rel='stylesheet'>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .outcome-badge { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class='text-stone-800 border-t-4 border-stone-900'>
    <nav class='max-w-6xl mx-auto px-6 py-12 flex justify-between items-center'>
        <h1 class='text-3xl font-bold tracking-tight'>THE AURA SHOP</h1>
        <div class='flex gap-8 text-sm uppercase tracking-widest'>
            <span class='font-semibold border-b border-stone-900'>Catalog</span>
            <span class='text-stone-400'>Orders</span>
            <span class='text-stone-400'>About</span>
        </div>
    </nav>

    <main class='max-w-6xl mx-auto px-6 pb-24'>
        <section class='grid grid-cols-1 md:grid-cols-2 gap-12' id='product-list'>
            <!-- Products injected here -->
        </section>

        <!-- WithAGI Logic Trail Component (Initially Hidden) -->
        <section id='agi-outcome' class='mt-24 p-8 border border-stone-200 bg-white rounded-lg shadow-sm hidden'>
            <div class='flex items-center gap-3 mb-4'>
                <div class='w-3 h-3 bg-blue-500 rounded-full animate-pulse'></div>
                <span class='text-xs font-semibold uppercase tracking-widest text-blue-600'>WithAGI Outcome Engine</span>
            </div>
            <h2 class='text-xl mb-2' id='outcome-title'>Automating Order Logic...</h2>
            <p class='text-sm text-stone-500 max-w-lg' id='outcome-description'>Scanning codebase for business intent and applying optimizations.</p>
        </section>
    </main>

    <script>
        async function loadProducts() {
            const res = await fetch('/products');
            const products = await res.json();
            const container = document.getElementById('product-list');
            container.innerHTML = products.map(p => `
                <div class='group cursor-pointer'>
                    <div class='aspect-square bg-stone-200 mb-4 overflow-hidden relative'>
                        <div class='absolute inset-0 bg-stone-900/5 group-hover:bg-stone-900/0 transition-colors'></div>
                    </div>
                    <div class='flex justify-between items-start'>
                        <div>
                            <h3 class='text-lg font-semibold'>{p.name}</h3>
                            <p class='text-sm text-stone-500'>Stock: {p.inventory}</p>
                        </div>
                        <p class='text-lg font-bold'>${p.price.toFixed(2)}</p>
                    </div>
                </div>
            `).join('');
        }
        loadProducts();
    </script>
</body>
</html>
